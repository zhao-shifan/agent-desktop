name: deploy-pages

# 把「能在浏览器里装成 PWA 的那份前端」+「手机独立版」+「壁纸库」发布到 GitHub Pages（https，手机才能安装 PWA）。
# 仓库设置里需要把 Pages 来源改成 "GitHub Actions" 一次。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "小凡智能体-手机独立版.html"
      - "qrcode.js"
      - "official_skills.js"
      - "manifest.json"
      - "sw.js"
      - "icons/**"
      - "wallpapers/**"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read   # deploy-pages@v4 拉取 github-pages artifact 需要

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 组装站点目录（前端 + 手机版 + 壁纸，不放 server.py / 配置）
        run: |
          mkdir -p _site
          cp index.html qrcode.js official_skills.js manifest.json sw.js _site/
          cp "小凡智能体-手机独立版.html" _site/mobile.html
          cp -r icons _site/icons
          cp -r wallpapers _site/wallpapers

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # 等 artifact API 列表可见（服务端延迟时 deploy-pages 会报 Found 0 artifacts）
      - name: 等待 artifact 可见
        run: |
          for i in 1 2 3 4 5 6; do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts | length' 2>/dev/null || echo 0)
            echo "第 $i 次查询：$n 个 artifact"
            [ "$n" -ge 1 ] && exit 0
            sleep 15
          done
          echo "::warning::artifact 仍未可见，继续尝试部署"
        env:
          GH_TOKEN: ${{ github.token }}

      - id: deployment
        uses: actions/deploy-pages@v4
